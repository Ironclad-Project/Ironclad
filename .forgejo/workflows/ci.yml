name: CI

on: [push, pull_request]

jobs:
  build_and_check:
    name: Build project and check
    runs-on: docker
    container: debian:sid
    strategy:
      matrix:
        target_arch: [riscv64-limine, x86_64-limine]

    steps:
      - name: Sync and install basic dependencies
        run: apt-get update && apt-get -y dist-upgrade && apt-get install -y nodejs wget git autoconf automake build-essential findutils make texinfo highlight

      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Install project dependencies
        run: |
          set -ex

          wget https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-25.0.0-1/gprbuild-x86_64-linux-25.0.0-1.tar.gz
          echo '7faced0c0aed72c0dfe747a32bda8589aaee7502a2586573fb256232dff2ae86ea8708418aba1bbb3a2babe3cff80c46a6c79df89a444191e6712fa55143affd  gprbuild-x86_64-linux-25.0.0-1.tar.gz' | sha512sum -c
          tar -xf gprbuild-x86_64-linux-25.0.0-1.tar.gz
          mv gprbuild-x86_64-linux-25.0.0-1 gprbuild-tool

          case "${{matrix.target_arch}}" in \
            riscv64-limine) \
              wget https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.2.0-1/gnat-riscv64-elf-linux64-x86_64-15.2.0-1.tar.gz ; \
              echo '850b7f0b1e4ab37e0a48530c6da4b8395358ef7a8668699b2dacdb1d485415708f95f83e1adc86c8abd67b705052e3b6c650150ba55cd189a3ee7fbdb04b3e65  gnat-riscv64-elf-linux64-x86_64-15.2.0-1.tar.gz' | sha512sum -c ; \
              tar -xf gnat-riscv64-elf-linux64-x86_64-15.2.0-1.tar.gz ; \
              mv gnat-riscv64-elf-linux64-x86_64-15.2.0-1 gnat-tool ;; \
            x86_64-limine) \
              wget https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.2.0-1/gnat-x86_64-linux-15.2.0-1.tar.gz ; \
              echo 'd44dba012f221c63e553916f2348d2d569fc5dbd39411e8bde912ffb96e6f1f524e074df10bc215e577d47c743b8f5d33f9cd546fed38dac23cf9d2ce2db178a  gnat-x86_64-linux-15.2.0-1.tar.gz' | sha512sum -c ; \
              tar -xf gnat-x86_64-linux-15.2.0-1.tar.gz ; \
              mv gnat-x86_64-linux-15.2.0-1 gnat-tool ;; \
          esac

          wget https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-15.1.0-1/gnatprove-x86_64-linux-15.1.0-1.tar.gz
          echo 'fe7f6f80d741e83de82ff8e3c76200e7710caa61a93f041508ef818bb20acf0a3ae4a50eadf35f2295c11c6bdfe7edc11a984bcdb8d4dc658ce86e95905cf0f2  gnatprove-x86_64-linux-15.1.0-1.tar.gz' | sha512sum -c
          tar -xf gnatprove-x86_64-linux-15.1.0-1.tar.gz
          mv gnatprove-x86_64-linux-15.1.0-1 gnatprove-tool

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure step
        run: |
          set -ex
          export PATH="$PWD/gprbuild-tool/bin:$PWD/gnat-tool/bin:$PWD/gnatprove-tool/bin:$PATH"
          case "${{matrix.target_arch}}" in \
            riscv64-limine) \
              ./configure --host=riscv64-elf ;; \
            x86_64-limine) \
              ./configure ;; \
          esac

      - name: Build
        run: |
          set -ex
          export PATH="$PWD/gprbuild-tool/bin:$PWD/gnat-tool/bin:$PWD/gnatprove-tool/bin:$PATH"
          make -j$(nproc)

      - name: Verify RTS
        run: |
          set -ex
          export PATH="$PWD/gprbuild-tool/bin:$PWD/gnat-tool/bin:$PWD/gnatprove-tool/bin:$PATH"
          make check-rts -j$(nproc)

      - name: Verify kernel
        run: |
          set -ex
          export PATH="$PWD/gprbuild-tool/bin:$PWD/gnat-tool/bin:$PWD/gnatprove-tool/bin:$PATH"
          make check-kernel -j$(nproc)
