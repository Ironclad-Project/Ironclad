name: Spellcheck CI

on:
  push:
    paths:
      - 'docs/**'
      - '.forgejo/**'
  pull_request:
    paths:
      - 'docs/**'
      - '.forgejo/**'

jobs:
  build_and_check:
    name: Spellcheck documentation
    runs-on: docker
    container: archlinux:latest

    steps:
      - name: Sync and install dependencies
        run: pacman -Syu --noconfirm && pacman -S --noconfirm --needed nodejs wget git autoconf automake base-devel findutils make texinfo highlight typos

      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Check docs spelling
        run: typos docs
